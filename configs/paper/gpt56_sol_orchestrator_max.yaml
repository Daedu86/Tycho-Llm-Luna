# Selected-policy transfer configuration using OpenAI Responses with client-held encrypted
# reasoning replay.
model:
  backend: openai_responses
  llm_model: gpt-5.6-sol
  effort: max
  openai_stateless_reasoning: true
  http_timeout: 1800
  retry_budget_s: 3600

reasoning:
  effort: max
  max_tokens: 24000
  max_llm_calls: 3500
  max_tool_steps: 40
  max_inference_cost_per_game: 1500

vision:
  vision: true
  render_scale: 16
  text_grid: full

context:
  prompt_caching: true
  history: tail_evict
  grid_keep: 3
  image_keep: 3
  image_evict_mult: 2
  image_cap: 4
  reasoning_keep: 3
  context_emergency_soft_tokens: 200000

orchestration:
  mode: orchestrator

dev:
  meta_reflect: true
