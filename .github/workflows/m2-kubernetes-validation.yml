name: M2 Tycho Kubernetes Validation

on:
  push:
    branches: [feature/tycho-kubernetes-sandbox]

permissions:
  contents: write

jobs:
  tycho-kubernetes:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Tycho
        run: python -m pip install -e '.[dev]'
      - name: Compile package
        run: python -m compileall -q tycho
      - name: Kubernetes sandbox tests
        run: pytest -q tests/test_kubernetes_sandbox.py tests/test_experiment_harness.py
      - name: Build Kubernetes image
        run: docker build -f deploy/kubernetes/Containerfile -t tycho-kubernetes:m2 .
      - name: Verify Kubernetes runtime selector in image
        run: |
          docker run --rm \
            -e TYCHO_SANDBOX_RUNTIME=kubernetes \
            -e TYCHO_KUBERNETES_ISOLATED=1 \
            -e TYCHO_KUBERNETES_NETWORK_POLICY=deny-all \
            -e TYCHO_KUBERNETES_SERVICE_ACCOUNT_TOKEN=disabled \
            -e TYCHO_KUBERNETES_IMAGE=tycho-kubernetes:m2 \
            tycho-kubernetes:m2 --doctor
      - name: Generate current release manifest
        run: python scripts/generate_public_manifest.py
      - name: Validate generated public release
        run: python scripts/validate_public.py
      - name: Commit refreshed release manifest when stale
        run: |
          if git diff --quiet -- PUBLIC_RELEASE_MANIFEST.json; then
            echo "release manifest is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PUBLIC_RELEASE_MANIFEST.json
          git commit -m "fix(tycho): refresh public release manifest"
          git push origin HEAD:feature/tycho-kubernetes-sandbox
